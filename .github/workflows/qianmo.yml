name: 阡陌居签到 & 威望红包

on:
  # 北京时间 09:00（UTC 01:00）
  schedule:
    - cron: '0 1 * * *'
  # 支持手动点击运行
  workflow_dispatch:

# 设置最小权限，增强安全性
permissions:
  contents: read

jobs:
  sign:
    name: Run Qianmo Sign
    runs-on: ubuntu-latest

    # ✅ 关键：强制使用 Node.js 24，消除弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sign script
        # ✅ 关键：确保 Secrets 正确注入环境变量
        env:
          QM1000_COOKIE: ${{ secrets.QM1000_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          python qianmo.py
